<!doctype html>
<html lang="pt-BR">
  <body style="font-family: Arial, Helvetica, sans-serif; color: #1f2a1f; line-height: 1.5;">
    <h2 style="margin: 0 0 12px;">Fruteira Iracema: nova senha</h2>
    <p>Recebemos um pedido para criar uma nova senha de acesso ao sistema do mercadinho.</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery"
        style="display: inline-block; padding: 10px 18px; background: #1f6b3a; color: #ffffff; text-decoration: none; border-radius: 6px;"
      >
        Criar nova senha
      </a>
    </p>
    <p style="font-size: 13px; color: #555;">
      O link vale por 1 hora e só funciona uma vez. Se você não pediu, ignore este e-mail: sua senha
      continua a mesma.
    </p>
  </body>
</html>
